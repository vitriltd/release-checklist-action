name: Release Checklist
description: "Parses [release: ...] tags from commits and PRs and posts a sign-off checklist on the open Release Please PR"
author: vitriltd
branding:
  icon: check-square
  color: green
inputs:
  github-token:
    description: GitHub token with PR read/write access
    required: true
    default: ${{ github.token }}
  base-branch:
    description: The branch Release Please targets
    required: false
    default: main
  strip-tags-from-pr-body:
    description: "Whether to strip [release: ...] substrings from the Release Please PR body before posting the checklist. Keeps the resulting CHANGELOG.md clean. Set to false to leave tags inline."
    required: false
    default: "true"
runs:
  using: node20
  main: dist/index.js
